services:
  streamgremlin:
    image: git.orfel.de/jannik/streamgremlin:latest
    build: .
    container_name: streamgremlin
    restart: unless-stopped
    ports:
      - "127.0.0.1:4736:4736"
    env_file:
      - .env
    volumes:
      - ./config:/app/config
      - ./sounds:/app/sounds
    networks:
      - jannik-cloud-net

networks:
  jannik-cloud-net:
    external: true

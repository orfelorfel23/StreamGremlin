triggers:
- id: cmd_bonk
  name: Bonk
  enabled: true
  type: command
  pattern: bonk
  match_mode: word
  allowed_roles:
  - everyone
  cooldown_sec: 5
  actions:
  - type: sound
    target: both
    pool:
    - bonk.wav
    volume: 0.85
  - type: bouncing_emotes
    target: both
    count: 5
    is_hype: false
- id: cmd_tts
  name: Text-to-Speech
  enabled: true

general:
  port: 4736
  prefix: '!'
  global_cooldown_sec: 3
  user_cooldown_sec: 15
  bot_chat_reply: true
  overlay_resolution: 1920x1080
  troll_hud_enabled: true
  chat_velocity_threshold: 15
  chat_emotes_auto_bounce: true
  n8n_webhook_url: ''
  home_assistant:
    url: https://home.orfel.de
    default_entity: light.gaming_zimmer
tts:
  enabled: true
  engine: edge-tts
  default_voice: de-DE-KatjaNeural
  available_voices:
  - id: de-DE-KatjaNeural
    label: Katja (DE - Natürlich Weiblich)
  - id: de-DE-ConradNeural
    label: Conrad (DE - Klar Männlich)
  - id: de-DE-KillianNeural
    label: Killian (DE - Dynamisch Männlich)
  - id: de-DE-AmalaNeural
    label: Amala (DE - Modern Weiblich)
  - id: en-US-ChristopherNeural
    label: Christopher (US - Narrator)
  - id: en-US-JennyNeural
    label: Jenny (US - Conversational)
  max_characters: 200
  volume: 0.9
auth:
  admin_password_hash: ''
  streamer_password_hash: ''
  mod_password_hash: ''
  permissions:
    streamer:
      can_manage_triggers: false
      can_upload_sounds: false
      can_edit_cooldowns: true
      can_configure_twitch: true
      can_manage_mod_permissions: true
    mod:
      can_trigger_panic: true
      can_use_live_deck: true
      can_trigger_tests: true
      can_mute_audio: true
sounds:
  access_denied_buzzer.wav:
    volume: 0.85
  airhorn.wav:
    volume: 0.75
  bitcrush_8bit.wav:
    volume: 0.85
  boing.wav:
    volume: 0.85
  bonk.wav:
    volume: 0.85
  bottle_pop.wav:
    volume: 0.85
  censor_beep.wav:
    volume: 0.8
  dimension_warp.wav:
    volume: 0.85
  earthquake_rumble.wav:
    volume: 0.9
  evil_laugh.wav:
    volume: 0.85
  f1_whoosh.wav:
    volume: 0.85
  flashbang.wav:
    volume: 0.9
  fuse_switch.wav:
    volume: 0.85
  glitch_static.wav:
    volume: 0.85
  heartbeat.wav:
    volume: 0.85
  hype_horn.wav:
    volume: 0.85
  jumpscare_screech.wav:
    volume: 0.9
